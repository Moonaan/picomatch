name: Publish
# Publishes @moonaan/picomatch to GitHub Packages (npm.pkg.github.com), following the
# moonaan-evergreen-pulse publish.yml pattern:
#   • push: moonaan-main — publish-on-merge. A merge that bumped package.json "version" to a value
#                          not yet on the registry ships it; an unchanged version is a clean no-op.
#   • release: published — manual/backup path.
# Auth: the built-in GITHUB_TOKEN only (packages: write); no PAT, no long-lived npm keys.
# picomatch ships no lockfile, so devDependencies install with `npm install --ignore-scripts`.
on:
  release:
    types: [published]
  push:
    branches: [moonaan-main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@moonaan'
      - id: ver
        name: Check whether this version is already published
        run: |
          NAME=$(jq -r .name package.json)
          VER=$(jq -r .version package.json)
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is already on the registry — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is not on the registry — will publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - if: steps.ver.outputs.exists == 'false'
        run: npm publish --ignore-scripts --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
